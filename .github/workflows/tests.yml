name: Test gesture engine
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile source
        run: python -m compileall -q airmouse
      - name: Run unit tests (no webcam required)
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python -m airmouse --help
